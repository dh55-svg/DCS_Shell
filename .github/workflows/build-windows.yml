name: Build & Test (Windows)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts qtserialport'

      - name: Install vcpkg dependencies
        run: |
          git clone https://github.com/microsoft/vcpkg.git ${{ runner.temp }}\vcpkg
          ${{ runner.temp }}\vcpkg\bootstrap-vcpkg.bat
          ${{ runner.temp }}\vcpkg\vcpkg install libmodbus:x64-windows
        continue-on-error: true

      - name: Configure
        run: >
          cmake -S ${{ github.workspace }} -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTS=ON
          -DBUILD_PLUGINS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Install Doxygen
        run: choco install doxygen.install --no-progress || true

      - name: Generate API docs
        run: doxygen Doxyfile 2>&1

      - name: Test
        run: ctest --test-dir build --output-on-failure -j4

